name: pages

# Publishes exampleSite/ to GitHub Pages — the demo linked from theme.toml.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions". Until that
# is switched on, the deploy step fails and the build step still passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build exampleSite, plus one build per home style
        working-directory: exampleSite
        # baseURL comes from the Pages config rather than hugo.toml, so this
        # works unchanged on a fork or a user/org page at a different path.
        #
        # The variants are real builds of the same exampleSite under a subpath,
        # not screenshots, so they cannot drift from the theme. Each gets its own
        # baseURL or every internal link would point back at the default demo.
        run: |
          base="${{ steps.pages.outputs.base_url }}"

          hugo --themesDir ../.. --minify --baseURL "$base/"

          build_variant() {
            name="$1"; shift
            echo "::group::variant $name"
            env "$@" hugo --themesDir ../.. --minify \
                 --baseURL "$base/$name/" \
                 --destination "public/$name"
            echo "::endgroup::"
          }

          build_variant ledger  HUGO_PARAMS_HOMESTYLE=ledger
          build_variant profile HUGO_PARAMS_HOMEHEADER=profile
          build_variant grouped HUGO_PARAMS_HOMESTYLE=ledger HUGO_PARAMS_HOMEGROUPBYYEAR=true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
