name: pages

# Publishes exampleSite/ to GitHub Pages — the demo linked from theme.toml.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions". Until that
# is switched on, the deploy step fails and the build step still passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build exampleSite
        working-directory: exampleSite
        # baseURL comes from the Pages config rather than hugo.toml, so this
        # works unchanged on a fork or a user/org page at a different path.
        run: |
          hugo --themesDir ../.. \
               --minify \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
